global:
  scrape_interval: 15s

scrape_configs:
  - job_name: simple-rag
    metrics_path: /metrics
    static_configs:
      - targets:
          - fastapi:8000

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
